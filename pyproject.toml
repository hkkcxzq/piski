[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "quant"
version = "0.1.0"
description = "Systematic research and trading system for crypto futures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8",
    "defusedxml>=0.7",
    "httpx>=0.27",
    "numba>=0.60",
    "numpy>=1.26",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "pytest>=8.2",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
    "types-defusedxml>=0.7",
]

[project.scripts]
quant = "quant.app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N", "S", "DTZ", "T20"]
ignore = [
    "PLR0917",  # positional args are fine in numeric kernels
    "PLR0913",  # many-args functions are explicit by design in config-heavy code
    "PLR2004",  # magic numbers are fine in statistics code with named context
    "PLR0911", "PLR0912", "PLR0915",  # long numeric/reporting routines are kept linear on purpose
    "E741",     # `l` is the conventional name for bar lows (OHLC)
    "S311",     # `random` is used for reproducible research sampling, never for security
    "RUF001", "RUF002", "RUF003",  # Cyrillic text in strings/comments is intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["quant"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "numba", "numba.*"]
ignore_missing_imports = true
